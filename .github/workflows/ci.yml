name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run tests
        run: pytest -v

  boot:
    # Verify the wrapper starts and answers 402 with a Kite-shaped challenge.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Boot and probe
        env:
          PAY_TO: "0x139Ee8B5f6f9aa326AfDe675A0E4eB269b3ADc19"
          KITE_NETWORK: testnet
          UPSTREAM_URL: "https://api.open-meteo.com"
          PRICE_USD: "0.001"
          PORT: "8080"
        run: |
          uvicorn kite_x402.app:app --port 8080 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8080/healthz && break; sleep 1; done
          curl -sf http://127.0.0.1:8080/healthz
          test "$(curl -s -o /dev/null -w '%{http_code}' 'http://127.0.0.1:8080/v1/forecast?latitude=52.52')" = "402"
          curl -si 'http://127.0.0.1:8080/v1/forecast?latitude=52.52' | grep -i '^payment-required:' | head -1 | grep -q .
